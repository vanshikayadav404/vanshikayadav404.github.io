<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Strings DSA Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #151518;
    --surface2: #1c1c21;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #f0eff5;
    --muted: #7a7a8c;
    --faint: #3a3a4a;
    --purple: #a78bfa;
    --purple-bg: rgba(167,139,250,0.1);
    --purple-border: rgba(167,139,250,0.25);
    --green: #4ade80;
    --green-bg: rgba(74,222,128,0.1);
    --amber: #fbbf24;
    --amber-bg: rgba(251,191,36,0.1);
    --red: #f87171;
    --red-bg: rgba(248,113,113,0.1);
    --teal: #2dd4bf;
    --teal-bg: rgba(45,212,191,0.08);
    --accent: #7c3aed;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: 0;
  }
  a { color: inherit; text-decoration: none; }

  .layout { display: flex; min-height: 100vh; }
  .sidebar {
    width: 240px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 2rem 1.2rem;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0;
    z-index: 10;
  }
  .sidebar-brand {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--purple);
    margin-bottom: 2rem;
    font-family: 'JetBrains Mono', monospace;
  }
  .sidebar-section { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--faint); margin: 1.2rem 0 0.5rem; font-family: 'JetBrains Mono', monospace; }
  .sidebar-link {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 10px; border-radius: 8px; cursor: pointer;
    font-size: 13px; color: var(--muted);
    transition: all 0.15s; border: none; background: none; width: 100%; text-align: left;
    gap: 6px;
  }
  .sidebar-link:hover { background: var(--surface2); color: var(--text); }
  .sidebar-link.active { background: var(--purple-bg); color: var(--purple); border: 1px solid var(--purple-border); }
  .sidebar-link .cnt {
    font-size: 11px; background: var(--surface2); border-radius: 20px;
    padding: 1px 7px; color: var(--muted); font-family: 'JetBrains Mono', monospace;
  }
  .sidebar-link.active .cnt { background: var(--purple-bg); color: var(--purple); }
  .sidebar-progress { margin-top: auto; padding-top: 2rem; }
  .sidebar-progress-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; font-family: 'JetBrains Mono', monospace; }
  .prog-track { height: 4px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
  .prog-fill { height: 100%; background: var(--purple); border-radius: 4px; transition: width 0.5s; }
  .prog-pct { font-size: 22px; font-weight: 700; color: var(--purple); margin-top: 8px; font-family: 'JetBrains Mono', monospace; }

  .main { margin-left: 240px; flex: 1; padding: 2.5rem 2.5rem 4rem; max-width: calc(100vw - 240px); }

  .page-title { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 4px; }
  .page-sub { font-size: 14px; color: var(--muted); margin-bottom: 2rem; }

  .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 2rem; }
  .stat-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 18px;
  }
  .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-family: 'JetBrains Mono', monospace; margin-bottom: 6px; }
  .stat-val { font-size: 28px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
  .stat-val.done { color: var(--green); }
  .stat-val.easy { color: var(--green); }
  .stat-val.med { color: var(--amber); }
  .stat-val.hard { color: var(--red); }
  .stat-val.total { color: var(--purple); }

  .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 1.8rem; }
  .search {
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: 8px; padding: 8px 14px; font-size: 13px;
    color: var(--text); outline: none; font-family: 'Syne', sans-serif;
    min-width: 220px;
    transition: border-color 0.15s;
  }
  .search:focus { border-color: var(--purple); }
  .search::placeholder { color: var(--muted); }
  .fbtn {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 14px; font-size: 12px;
    color: var(--muted); cursor: pointer; font-family: 'Syne', sans-serif;
    transition: all 0.15s; font-weight: 500;
  }
  .fbtn:hover { border-color: var(--border2); color: var(--text); }
  .fbtn.active { background: var(--purple-bg); border-color: var(--purple-border); color: var(--purple); }

  .topic-group { margin-bottom: 2rem; }
  .topic-header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0; margin-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .topic-name { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
  .topic-badge { font-size: 11px; background: var(--surface2); border-radius: 20px; padding: 2px 9px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
  .topic-interview { font-size: 11px; background: var(--teal-bg); border: 1px solid rgba(45,212,191,0.2); border-radius: 20px; padding: 2px 9px; color: var(--teal); margin-left: auto; }

  .q-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; border-radius: 10px; cursor: pointer;
    transition: background 0.12s; border-bottom: 1px solid var(--border);
    position: relative;
  }
  .q-row:last-child { border-bottom: none; }
  .q-row:hover { background: var(--surface2); }
  .q-row.done { opacity: 0.45; }
  .q-row.done .q-name { text-decoration: line-through; }

  .chk {
    width: 18px; height: 18px; border-radius: 50%;
    border: 1.5px solid var(--faint); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .q-row.done .chk { background: var(--green); border-color: var(--green); }
  .chk svg { display: none; }
  .q-row.done .chk svg { display: block; }

  .q-num { font-size: 12px; color: var(--muted); font-family: 'JetBrains Mono', monospace; min-width: 42px; }
  .q-name { font-size: 14px; flex: 1; font-weight: 500; }
  .q-pat {
    font-size: 11px; padding: 3px 9px; border-radius: 20px;
    background: var(--purple-bg); color: var(--purple);
    border: 1px solid var(--purple-border); flex-shrink: 0;
    font-family: 'JetBrains Mono', monospace;
  }
  .diff-badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 600; flex-shrink: 0; font-family: 'JetBrains Mono', monospace; }
  .E { background: var(--green-bg); color: var(--green); }
  .M { background: var(--amber-bg); color: var(--amber); }
  .H { background: var(--red-bg); color: var(--red); }
  .must-tag { font-size: 10px; padding: 2px 7px; border-radius: 20px; background: rgba(251,191,36,0.15); color: var(--amber); border: 1px solid rgba(251,191,36,0.25); flex-shrink: 0; font-family: 'JetBrains Mono', monospace; }
  .lc-a { font-size: 12px; color: var(--muted); flex-shrink: 0; transition: color 0.1s; }
  .lc-a:hover { color: var(--purple); }

  .empty { font-size: 14px; color: var(--muted); padding: 2rem 0; text-align: center; font-family: 'JetBrains Mono', monospace; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 4px; }
</style>
</head>

</main>
</div>

let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem('strings_done')||'[]')); } catch(e){}
let diffF = 'all', topicF = 'all', mustF = false;

function save() { try { localStorage.setItem('strings_done', JSON.stringify([...done])); } catch(e){} }
function toggle(id) { if(done.has(id)) done.delete(id); else done.add(id); save(); render(); }

function filterDiff(v, btn) {
  diffF = v;
  document.querySelectorAll('.filter-bar .fbtn').forEach(b => { if(['All','Easy','Medium','Hard'].includes(b.textContent.trim())) b.classList.remove('active'); });
  btn.classList.add('active'); render();
}
function filterTopic(v, btn) {
  topicF = v;
  document.querySelectorAll('.sidebar-link').forEach(b => b.classList.remove('active'));
  btn.classList.add('active'); render();
}
function filterMust(btn) { mustF = !mustF; btn.classList.toggle('active', mustF); render(); }

function render() {
  const q = document.getElementById('search-in').value.toLowerCase();
  let filtered = UNIQUE.filter(p => {
    if(diffF !== 'all' && p.diff !== diffF) return false;
    if(topicF !== 'all' && p.topic !== topicF) return false;
    if(mustF && !p.must) return false;
    if(q && !p.name.toLowerCase().includes(q) && !String(p.lc).includes(q) && !p.pat.toLowerCase().includes(q)) return false;
    return true;
  });

  document.getElementById('s-total').textContent = UNIQUE.length;
  const doneCount = UNIQUE.filter(p => done.has(p.id)).length;
  document.getElementById('s-done').textContent = doneCount;
  document.getElementById('s-easy').textContent = UNIQUE.filter(p=>p.diff==='E').length;
  document.getElementById('s-med').textContent = UNIQUE.filter(p=>p.diff==='M').length;
  document.getElementById('s-hard').textContent = UNIQUE.filter(p=>p.diff==='H').length;
  const pct = UNIQUE.length ? Math.round(doneCount/UNIQUE.length*100) : 0;
  document.getElementById('side-prog').style.width = pct+'%';
  document.getElementById('side-pct').textContent = pct+'%';

  document.getElementById('cnt-all').textContent = UNIQUE.length;
  TOPIC_ORDER.forEach((t,i) => { const el = document.getElementById('cnt-'+i); if(el) el.textContent = UNIQUE.filter(p=>p.topic===t).length; });

  const el = document.getElementById('list');
  if(!filtered.length) { el.innerHTML = '<div class="empty">// no problems match filters</div>'; return; }

  const groups = {};
  TOPIC_ORDER.forEach(t => groups[t] = []);
  filtered.forEach(p => { if(groups[p.topic]) groups[p.topic].push(p); });

  let html = '';
  TOPIC_ORDER.forEach(topic => {
    const qs = groups[topic];
    if(!qs.length) return;
    const intv = TOPIC_INTERVIEW[topic] || '';
    html += `<div class="topic-group"><div class="topic-header"><span class="topic-name">${topic}</span><span class="topic-badge">${qs.length} problems</span>${intv?`<span class="topic-interview">${intv}</span>`:''}</div>`;
    qs.forEach(p => {
      const isDone = done.has(p.id);
      const slug = p.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/-+$/,'');
      html += `<div class="q-row${isDone?' done':''}" onclick="toggle(${p.id})">
        <div class="chk"><svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4L3.5 6.5L9 1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <span class="q-num">#${p.lc}</span>
        <span class="q-name">${p.name}</span>
        ${p.must?'<span class="must-tag">⭐ must</span>':''}
        <span class="q-pat">${p.pat}</span>
        <span class="diff-badge ${p.diff}">${p.diff==='E'?'Easy':p.diff==='M'?'Medium':'Hard'}</span>
        <a class="lc-a" href="https://leetcode.com/problems/${slug}/" target="_blank" onclick="event.stopPropagation()">↗ LC</a>
      </div>`;
    });
    html += `</div>`;
  });
  el.innerHTML = html;
}

render();
</script>
</body>
</html>
